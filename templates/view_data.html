<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modbus Data</title>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
    <style>
        #myGrid {
            width: 100%;
            height: 500px;
        }
    </style>
</head>
<body>
<h1>Modbus Register Data</h1>
<div id="myGrid"></div>

<script>
    const columnDefs = [
        {headerName: "ID", field: "id", sortable: true, filter: true},
        {headerName: "Timestamp", field: "timestamp", sortable: true, filter: true},
        {headerName: "Register 1", field: "register1", sortable: true, filter: true},
        {headerName: "Register 2", field: "register2", sortable: true, filter: true},
        {headerName: "Register 3", field: "register3", sortable: true, filter: true},
        {headerName: "Register 4", field: "register4", sortable: true, filter: true},
        {headerName: "Register 5", field: "register5", sortable: true, filter: true},
        {headerName: "Register 6", field: "register6", sortable: true, filter: true},
        {headerName: "Register 7", field: "register7", sortable: true, filter: true},
        {headerName: "Register 8", field: "register8", sortable: true, filter: true},
        {headerName: "Register 9", field: "register9", sortable: true, filter: true},
        {headerName: "Register 10", field: "register10", sortable: true, filter: true},
        {headerName: "Register 11", field: "register11", sortable: true, filter: true},
    ];

    const gridOptions = {
        columnDefs: columnDefs,
        rowData: [],  // Start with an empty array
        pagination: true,
        paginationPageSize: 25,
        getRowId: params => params.data.id, // IMPORTANT: Use 'id' as the row ID
    };
    let gridApi;
    document.addEventListener("DOMContentLoaded", function () {
        const eGridDiv = document.querySelector("#myGrid");
        gridApi = agGrid.createGrid(eGridDiv, gridOptions);
    });

    // Fetch initial data from /data
    fetch('/data')
        .then(response => response.json())
        .then(initialData => {
            // Set the initial row data
            gridOptions.rowData = initialData;

            // Connect to WebSocket *after* initial data is loaded
            connectWebSocket();
        })
        .catch(error => console.error('Error fetching initial data:', error));

    function connectWebSocket() {
        const clientId = Math.floor(Math.random() * 1000000);
        const ws = new WebSocket(`ws://0.0.0.0:8000/ws/${clientId}`);

        ws.onmessage = (event) => {
            console.log("Message from server:", event.data);
            try {
                const newData = JSON.parse(event.data);

                // Use applyTransaction to efficiently add/update rows
                gridApi.applyTransaction({add: [newData]});

            } catch (error) {
                console.error("Error parsing WebSocket message:", error);
            }
        };

        ws.onclose = () => {
            console.log("WebSocket connection closed");
        };

        ws.onerror = (error) => {
            console.error("WebSocket error:", error);
        };
    }

</script>
</body>
</html>
